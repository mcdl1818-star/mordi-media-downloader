services:
  - type: web
    name: mordi-media-downloader
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_TELEGRAM_USER_ID
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: WEBHOOK_URL
        value: https://mordi-media-downloader.onrender.com
      - key: MAX_FILE_SIZE_MB
        value: "49"
      - key: MAX_MEDIA_ITEMS
        value: "15"
      - key: MEDIA_CONCURRENCY
        value: "3"
      - key: TEMP_TTL_MINUTES
        value: "30"
      - key: YOUTUBE_PROXY_URL
        sync: false
      - key: GITHUB_ACTIONS_TOKEN
        sync: false
      - key: GITHUB_ACTIONS_REPO
        value: mcdl1818-star/mordi-media-downloader
      - key: GITHUB_ACTIONS_WORKFLOW
        value: youtube-worker.yml
